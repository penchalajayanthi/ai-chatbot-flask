<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Chatbot – Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal-deep:  #082e2a;
      --teal-dark:  #0d4a45;
      --teal-mid:   #1a7a6e;
      --teal-light: #2db89a;
      --teal-glow:  #3de8c8;
    }

    body {
      font-family: 'Raleway', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      position: relative;
      background: #071e1b;
      padding: 24px 16px;
    }

    #bg-canvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    /* Stars */
    .stars { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
    .star {
      position: absolute; border-radius: 50%; background: white; opacity: 0;
      animation: twinkle var(--d,3s) ease-in-out infinite var(--dl,0s);
    }
    @keyframes twinkle {
      0%,100%{ opacity:0; transform:scale(.5); }
      50%{ opacity:var(--b,.7); transform:scale(1.3); }
    }

    /* Orbs */
    .orb {
      position: fixed; border-radius: 50%; filter: blur(60px);
      pointer-events: none; z-index: 1;
      animation: orbFloat var(--od,12s) ease-in-out infinite var(--odl,0s);
    }
    @keyframes orbFloat {
      0%,100%{ transform:translateY(0) scale(1); opacity:.35; }
      50%{ transform:translateY(-30px) scale(1.1); opacity:.55; }
    }

    /* Sparks */
    .spark {
      position: fixed; width:5px; height:5px; border-radius:50%;
      background: var(--teal-glow); pointer-events:none; z-index:2;
      animation: sparkRise var(--sd,10s) ease-in-out infinite var(--sdl,0s);
    }
    @keyframes sparkRise {
      0%{ transform:translateY(0) translateX(0); opacity:0; }
      15%{ opacity:.9; } 85%{ opacity:.4; }
      100%{ transform:translateY(-150px) translateX(var(--sx,20px)); opacity:0; }
    }

    /* Card */
    .card {
      position: relative; z-index: 10;
      width: 100%; max-width: 420px;
      background: rgba(255,255,255,0.97);
      border-radius: 26px; overflow: hidden;
      box-shadow: 0 32px 90px rgba(0,0,0,.45), 0 0 0 1.5px rgba(61,232,200,.18), 0 0 60px rgba(45,184,154,.08);
      animation: cardIn .9s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes cardIn {
      from{ opacity:0; transform:translateY(50px) scale(.95); }
      to{ opacity:1; transform:translateY(0) scale(1); }
    }

    /* Card header */
    .card-header {
      position: relative; height: 165px; overflow: hidden;
      background: linear-gradient(160deg, #071e1b 0%, #0d4a45 55%, #1a8a70 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      padding-top: 20px;
    }
    .header-scene {
      position: absolute; bottom:0; left:0; right:0;
      height:90px; pointer-events:none;
    }
    .hstar { position:absolute; background:white; border-radius:50%; }

    /* Glowing leaf / sprout icon instead of moon */
    .sprout-icon {
      position: relative; z-index: 2;
      width: 44px; height: 44px;
      margin-bottom: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .sprout-ring {
      position: absolute; inset: 0; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #a8fff0, #3de8c8 55%, #2db89a);
      box-shadow: 0 0 22px 7px rgba(61,232,200,.45), 0 0 55px 18px rgba(61,232,200,.18);
      animation: moonGlow 4s ease-in-out infinite;
    }
    @keyframes moonGlow {
      0%,100%{ box-shadow:0 0 22px 7px rgba(61,232,200,.45),0 0 55px 18px rgba(61,232,200,.18); }
      50%{ box-shadow:0 0 34px 12px rgba(61,232,200,.65),0 0 70px 25px rgba(61,232,200,.28); }
    }
    .sprout-ring svg { position:relative; z-index:1; width:28px; height:28px; }

    .header-title {
      font-family: 'Cinzel', serif; color:#fff; font-size:15.5px;
      letter-spacing:2.5px; z-index:2; text-shadow:0 0 22px rgba(61,232,200,.6);
    }
    .header-sub {
      color:rgba(255,255,255,.5); font-size:10.5px;
      letter-spacing:1.2px; margin-top:5px; z-index:2;
    }

    /* Card body */
    .card-body { padding: 20px 28px 26px; background: white; }
    .signup-label {
      text-align:center; font-family:'Cinzel',serif;
      font-size:13px; letter-spacing:3px; color:var(--teal-mid);
      margin-bottom:14px; text-transform:uppercase;
    }

    .input-row {
      display:grid; grid-template-columns:1fr 1fr; gap:10px;
      margin-bottom:0;
    }

    .input-wrap { position:relative; margin-bottom:10px; }
    .input-wrap.full { grid-column: 1 / -1; }

    .input-icon {
      position:absolute; left:13px; top:50%;
      transform:translateY(-50%); font-size:13px;
      pointer-events:none; z-index:1;
    }
    .input-wrap input {
      width:100%;
      padding:10px 14px 10px 38px;
      border:none; border-radius:10px;
      background:linear-gradient(135deg, var(--teal-deep), var(--teal-mid));
      color:#fff; font-family:'Raleway',sans-serif;
      font-size:12.5px; outline:none; letter-spacing:.4px;
      transition:box-shadow .3s;
    }
    .input-wrap input::placeholder { color:rgba(255,255,255,.5); }
    .input-wrap input:focus {
      box-shadow:0 0 0 2px var(--teal-glow), 0 6px 20px rgba(45,184,154,.3);
    }

    /* Password strength bar */
    .strength-bar {
      display:flex; gap:4px; margin-top:4px; margin-bottom:2px;
    }
    .strength-seg {
      flex:1; height:3px; border-radius:2px;
      background:#eee; transition:background .3s;
    }
    .strength-label {
      font-size:10px; color:#aaa; text-align:right;
      margin-bottom:8px; min-height:13px; transition:color .3s;
    }

    .terms-row {
      display:flex; align-items:flex-start; gap:8px;
      margin:2px 0 14px; font-size:11.5px; color:#888;
      line-height:1.5;
    }
    .terms-row input[type=checkbox] { accent-color:var(--teal-mid); margin-top:2px; cursor:pointer; flex-shrink:0; }
    .terms-row a { color:var(--teal-mid); font-weight:600; text-decoration:none; }
    .terms-row a:hover { color:var(--teal-dark); }

    /* Button */
    .btn-signup {
      width:100%; padding:14px;
      background:linear-gradient(135deg, var(--teal-deep) 0%, var(--teal-mid) 100%);
      border:none; border-radius:10px; color:#fff;
      font-family:'Cinzel',serif; font-size:13px;
      letter-spacing:3.5px; cursor:pointer;
      position:relative; overflow:hidden;
      transition:transform .25s, box-shadow .25s;
    }
    .btn-signup::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(135deg, transparent 40%, rgba(255,255,255,.1));
      pointer-events:none;
    }
    .btn-signup:hover { transform:translateY(-2px); box-shadow:0 10px 28px rgba(13,74,69,.45); }
    .btn-signup:active { transform:translateY(0); }

    /* Divider */
    .divider {
      text-align:center; color:#ccc; font-size:11px;
      margin:14px 0; position:relative;
    }
    .divider::before,.divider::after {
      content:''; position:absolute; top:50%; width:40%; height:1px; background:#eee;
    }
    .divider::before{ left:0; } .divider::after{ right:0; }

    /* AI badge */
    .ai-badge { display:flex; align-items:center; justify-content:center; gap:7px; margin-bottom:12px; }
    .ai-dot {
      width:8px; height:8px; background:var(--teal-light);
      border-radius:50%; box-shadow:0 0 7px var(--teal-light);
      animation:blink 1.8s ease-in-out infinite;
    }
    @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:.25;} }
    .ai-text { font-size:10px; letter-spacing:2.5px; color:#aaa; text-transform:uppercase; }

    /* Login link */
    .login-row { text-align:center; font-size:12px; color:#999; }
    .login-row a { color:var(--teal-mid); font-weight:600; text-decoration:none; transition:color .2s; }
    .login-row a:hover { color:var(--teal-dark); }
  </style>
</head>
<body>

<div class="card">

  <!-- Header -->
  <div class="card-header" id="cardHeader">
    <!-- Sprout / leaf icon -->
    <div class="sprout-icon">
      <div class="sprout-ring">
        <!-- leaf SVG centered -->
        <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg"

          <path d="M14 22 C14 22 8 17 8 11 C8 7.13 10.69 4 14 4 C17.31 4 20 7.13 20 11 C20 17 14 22 14 22Z"

      <polygon points="0,90 55,72 115,82 200,60 280,76 360,62 420,70 420,90"            fill="rgba(10,53,48,0.75)"/>

      <polygon points="54,84 47,71 61,71"   fill="rgba(6,28,25,.8)"/>
      <polygon points="366,80 358,62 374,62" fill="rgba(4,18,16,.8)"/>

  <!-- Body -->

    <div class="signup-label">Sign Up</div>

      <!-- Row 1: First & Last name -->
      <div class="input-row">
        <div class="input-wrap">
          <span class="input-icon">👤</span>
          <input type="text" name="first_name" placeholder="First Name" required/>

    </div>

    <div class="login-row">
      Already have an account? <a href="/">Log in</a>
    </div>

<!-- ═══════════ JS ═══════════ -->
<script>
  // Background stars
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 100; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() < 0.15 ? 3 : 2;
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*75}%;
      width:${size}px;height:${size}px;
      --d:${2+Math.random()*5}s;--dl:${Math.random()*6}s;--b:${0.35+Math.random()*0.65};`;
    starsEl.appendChild(s);
  }

  // Header mini stars
  const hdr = document.getElementById('cardHeader');
  for (let i = 0; i < 28; i++) {
    const s = document.createElement('div');
    s.className = 'hstar';
    const sz = Math.random() < 0.2 ? 3 : 2;
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*80}%;
      width:${sz}px;height:${sz}px;opacity:${0.3+Math.random()*0.7};`;
    hdr.insertBefore(s, hdr.firstChild);
  }

  // Password strength meter
  const passInput     = document.getElementById('passInput');
  const segs          = [document.getElementById('seg1'),document.getElementById('seg2'),
                         document.getElementById('seg3'),document.getElementById('seg4')];
  const strengthLabel = document.getElementById('strengthLabel');
  const levels = [
    { color:'#e74c3c', label:'Weak' },
    { color:'#e67e22', label:'Fair' },
    { color:'#f1c40f', label:'Good' },
    { color:'#2db89a', label:'Strong' },
  ];

  passInput.addEventListener('input', () => {
    const v = passInput.value;
    let score = 0;
    if (v.length >= 8)            score++;
    if (/[A-Z]/.test(v))          score++;
    if (/[0-9]/.test(v))          score++;
    if (/[^A-Za-z0-9]/.test(v))   score++;

    segs.forEach((seg, i) => {
      seg.style.background = i < score ? levels[score-1].color : '#eee';
    });
    strengthLabel.textContent = v.length ? levels[score ? score-1 : 0].label : '';
    strengthLabel.style.color = v.length ? levels[score ? score-1 : 0].color : '#aaa';
  });
</script>
</body>
</html>
