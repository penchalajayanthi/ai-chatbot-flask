<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Reset Password</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Raleway:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      font-family: 'Raleway', sans-serif;
      background: linear-gradient(135deg, #071e1b, #0d4a45);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    /* CARD */
    .card {
      width: 380px;
      background: rgba(255, 255, 255, 0.97);
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
    }

    /* TITLE */
    .login-label {
      text-align: center;
      font-family: 'Cinzel', serif;
      letter-spacing: 3px;
      margin-bottom: 20px;
      color: #1a7a6e;
    }

    /* INPUT */
    .input-wrap {
      position: relative;
      margin-bottom: 15px;
    }

    .input-wrap input {
      width: 80%;
      padding: 12px 40px 12px 40px;
      border-radius: 10px;
      border: none;
      /* background: linear-gradient(135deg, #082e2a, #1a7a6e); */
      color: black;
      outline: none;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: black;
    }

    /* TOGGLE ICON */
    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: black;
      cursor: pointer;
    }

    /* BUTTON */
    .btn-login {
      width: 60%;
      padding: 12px;
      background: linear-gradient(135deg, #082e2a, #1a7a6e);
      border: none;
      color: white;
      border-radius: 10px;
      font-family: 'Cinzel', serif;
      letter-spacing: 2px;
      cursor: pointer;
      display: block;
      margin: 20px auto 0;
      transition: 0.3s;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    /* ERROR */
    .error-message {
      background: #ffebee;
      color: #c62828;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 15px;
    }

    /* SUCCESS */
    .success {
      color: green;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="login-label">Reset Password</div>

    {% if error %}
    <div class="error-message">{{ error }}</div>
    {% endif %}



    <form method="POST">

      <!-- NEW PASSWORD -->
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input type="password" id="passwordInput" name="new_password" placeholder="New Password" required>

        <span class="password-toggle" id="togglePassword">
          <i class="fa-solid fa-eye"></i>
        </span>
      </div>

      <!-- CONFIRM PASSWORD -->
      <div class="input-wrap">
        <span class="input-icon">🔐</span>
        <input type="password" id="confirmPassword" name="confirm_password" placeholder="Confirm Password" required>

        <span class="password-toggle" id="toggleConfirm">
          <i class="fa-solid fa-eye"></i>
        </span>
      </div>

      <button type="submit" class="btn-login">RESET</button>
      {% if message %}
      <div class="success">
        {{ message }}<br><br>
        <a href="/">🔙 Back to Login</a>
      </div>
      {% endif %}
    </form>
  </div>

  <script>
    // SINGLE CLEAN TOGGLE FUNCTION
    function setupToggle(inputId, toggleId) {
      const input = document.getElementById(inputId);
      const toggle = document.getElementById(toggleId);
      const icon = toggle.querySelector("i");

      toggle.addEventListener("click", () => {
        const isHidden = input.type === "password";

        input.type = isHidden ? "text" : "password";

        icon.classList.toggle("fa-eye");
        icon.classList.toggle("fa-eye-slash");
      });
    }

    // INIT
    setupToggle("passwordInput", "togglePassword");
    setupToggle("confirmPassword", "toggleConfirm");
  </script>

</body>

</html>
