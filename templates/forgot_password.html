<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Raleway', sans-serif;
    background: linear-gradient(135deg, #071e1b, #0d4a45);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

.card {
    width: 360px;
    background: rgba(255,255,255,0.96);
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 25px 70px rgba(0,0,0,0.5);
    animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
    from {opacity:0; transform: translateY(30px);}
    to {opacity:1; transform: translateY(0);}
}

.login-label {
    text-align: center;
    font-family: 'Cinzel', serif;
    letter-spacing: 3px;
    margin-bottom: 20px;
    color: #1a7a6e;
}

.input-wrap {
    margin-bottom: 15px;
}

.input-wrap input {
    width: 90%;
    padding: 12px 14px;
    border-radius: 10px;
    border:3px grey;
    /* background: linear-gradient(135deg, #082e2a, #1a7a6e); */
    color: #1a7a6e;
    font-size: 13px;
    outline: none;
    transition: 0.3s;
}

.input-wrap input::placeholder {
    color: #1a7a6e;
}

.input-wrap input:focus {
    box-shadow: 0 0 0 2px #3de8c8;
}

.btn-login {
    width: 30%;
    padding: 10px;
    height: 40px;
    background: linear-gradient(135deg, #082e2a, #1a7a6e);
    border: none;
    color: white;
    border-radius: 10px;
    font-family: 'Cinzel', serif;
    letter-spacing: 2px;
    cursor: pointer;
    transition: 0.3s;
     display: block;       
    margin: 15px auto; 
}

.btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}
.message {
    text-align: center;
    margin-top: 12px;
    font-size: 13px;
}

.success {
    color: #2e7d32;
}

.error {
    color: #c62828;
}

.back-link {
    display: block;
    text-align: center;
    margin-top: 15px;
    font-size: 12px;
    color: #1a7a6e;
    text-decoration: none;
    font-weight: 600;
}

.back-link:hover {
    color: #0d4a45;
}
</style>

</head>

<body>

<div class="card">

<div class="login-label">Forgot Password</div>

<form method="POST">

    <div class="input-wrap">
        <input type="email" name="email" placeholder="Enter your email" required>
    </div>

    <button type="submit" class="btn-login">SEND OTP</button>

    {% if message %}
    <div class="message success">{{ message }}</div>
    {% endif %}

    {% if error %}
    <div class="message error">{{ error }}</div>
    {% endif %}

</form>

<a href="/" class="back-link">← Back to Login</a>


</div>

</body>
</html>
