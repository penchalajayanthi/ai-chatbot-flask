<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Verify OTP</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Raleway', sans-serif;
    background: linear-gradient(135deg, #071e1b, #0d4a45);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

/* CARD */
.card {
    width: 360px;
    background: rgba(255,255,255,0.96);
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 25px 70px rgba(0,0,0,0.5);
    text-align: center;
}

/* TITLE */
.login-label {
    font-family: 'Cinzel', serif;
    letter-spacing: 3px;
    margin-bottom: 15px;
    color: #1a7a6e;
}

/* OTP BOXES */
.otp-container {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 20px 0;
}

.otp-box {
    width: 45px;
    height: 50px;
    text-align: center;
    font-size: 20px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #082e2a, #1a7a6e);
    color: white;
    outline: none;
}

.otp-box:focus {
    box-shadow: 0 0 0 2px #3de8c8;
}

/* BUTTON */
.btn-login {
    width: 60%;
    padding: 12px;
    background: linear-gradient(135deg, #082e2a, #1a7a6e);
    border: none;
    color: white;
    border-radius: 10px;
    font-family: 'Cinzel', serif;
    letter-spacing: 2px;
    cursor: pointer;
    margin: 10px auto;
    display: block;
}

.btn-login:hover {
    transform: translateY(-2px);
}

/* RESEND */
.resend {
    margin-top: 10px;
    font-size: 13px;
}

.resend a {
    color: #1a7a6e;
    text-decoration: none;
    font-weight: 600;
}

.resend a.disabled {
    color: gray;
    pointer-events: none;
}

/* TIMER */
.timer {
    font-size: 12px;
    color: #777;
}

/* SUCCESS */
.success-box {
    display: none;
    flex-direction: column;
    align-items: center;
}

.checkmark {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 4px solid #4CAF50;
    position: relative;
    animation: scaleUp 0.4s ease;
}

.checkmark::after {
    content: "";
    position: absolute;
    left: 18px;
    top: 30px;
    width: 15px;
    height: 30px;
    border-right: 4px solid #4CAF50;
    border-bottom: 4px solid #4CAF50;
    transform: rotate(45deg);
}

@keyframes scaleUp {
    from { transform: scale(0); }
    to { transform: scale(1); }
}

/* ERROR */
.error {
    color: red;
    font-size: 13px;
}
</style>

</head>

<body>

<div class="card">

<div id="otpSection">
    <div class="login-label">Verify OTP</div>


{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

<form method="POST" id="otpForm">

    <div class="otp-container">
        <input type="text" maxlength="1" class="otp-box">
        <input type="text" maxlength="1" class="otp-box">
        <input type="text" maxlength="1" class="otp-box">
        <input type="text" maxlength="1" class="otp-box">
        <input type="text" maxlength="1" class="otp-box">
        <input type="text" maxlength="1" class="otp-box">
    </div>

    <input type="hidden" name="otp" id="finalOtp">

    <!-- ✅ VERIFY BUTTON -->
    <button type="submit" class="btn-login">VERIFY</button>

</form>

<!-- TIMER + RESEND -->
<div class="timer" id="timer">Resend OTP in 30s</div>

<div class="resend">
    <a href="/resend-otp" id="resendLink" class="disabled">Resend OTP</a>
</div>


</div>

<!-- SUCCESS -->

<div class="success-box" id="successBox">
    <div class="checkmark"></div>
    <p style="margin-top:10px; color:#4CAF50;">OTP Verified!</p>
</div>

</div>

<script>
const inputs = document.querySelectorAll(".otp-box");
const finalOtp = document.getElementById("finalOtp");
const form = document.getElementById("otpForm");
const resendLink = document.getElementById("resendLink");
const timerEl = document.getElementById("timer");

// INPUT LOGIC
inputs.forEach((input, index) => {
    input.addEventListener("input", () => {
        if (input.value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
        }
        updateOtp();

        // AUTO SUBMIT
        if (getOtp().length === 6) {
            showSuccessAndSubmit();
        }
    });

    input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !input.value && index > 0) {
            inputs[index - 1].focus();
        }
    });
});

function getOtp() {
    let otp = "";
    inputs.forEach(i => otp += i.value);
    return otp;
}

function updateOtp() {
    finalOtp.value = getOtp();
}

// SUCCESS + SUBMIT
function showSuccessAndSubmit() {
    document.getElementById("otpSection").style.display = "none";
    document.getElementById("successBox").style.display = "flex";

    setTimeout(() => {
        form.submit();
    }, 1200);
}

// TIMER + RESEND CONTROL
let time = 30;

const countdown = setInterval(() => {
    time--;
    timerEl.textContent = "Resend OTP in " + time + "s";

    if (time <= 0) {
        clearInterval(countdown);
        timerEl.textContent = "";
        resendLink.classList.remove("disabled");
    }
}, 1000);
</script>

</body>
</html>
