<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chatbot – Login</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Raleway:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --teal-deep: #082e2a;
            --teal-dark: #0d4a45;
            --teal-mid: #1a7a6e;
            --teal-light: #2db89a;
            --teal-glow: #3de8c8;
            --white: #f0faf8;
            --card-bg: rgba(255, 255, 255, 0.97);
        }

        body {
            font-family: 'Raleway', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            position: relative;
            background: #071e1b;
            padding: 24px 16px;
        }

        #bg-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .stars {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background: white;
            opacity: 0;
            animation: twinkle var(--d, 3s) ease-in-out infinite var(--dl, 0s);
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0;
                transform: scale(.5);
            }

            50% {
                opacity: var(--b, .7);
                transform: scale(1.3);
            }
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            pointer-events: none;
            z-index: 1;
            animation: orbFloat var(--od, 12s) ease-in-out infinite var(--odl, 0s);
        }

        @keyframes orbFloat {

            0%,
            100% {
                transform: translateY(0) scale(1);
                opacity: .35;
            }

            50% {
                transform: translateY(-30px) scale(1.1);
                opacity: .55;
            }
        }

        .spark {
            position: fixed;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--teal-glow);
            pointer-events: none;
            z-index: 2;
            animation: sparkRise var(--sd, 10s) ease-in-out infinite var(--sdl, 0s);
        }

        @keyframes sparkRise {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }

            15% {
                opacity: .9;
            }

            85% {
                opacity: .4;
            }

            100% {
                transform: translateY(-150px) translateX(var(--sx, 20px));
                opacity: 0;
            }
        }

        .card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            border-radius: 26px;
            overflow: hidden;
            box-shadow:
                0 32px 90px rgba(0, 0, 0, .45),
                0 0 0 1.5px rgba(61, 232, 200, .18),
                0 0 60px rgba(45, 184, 154, .08);
            animation: cardIn .9s cubic-bezier(.22, 1, .36, 1) both;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(50px) scale(.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card-header {
            position: relative;
            height: 170px;
            overflow: hidden;
            background: linear-gradient(160deg, #071e1b 0%, #0d4a45 55%, #1a8a70 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 22px;
        }

        .header-scene {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 90px;
            pointer-events: none;
        }

        .hstar {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: .65;
        }

        .moon {
            width: 44px;
            height: 44px;
            background: radial-gradient(circle at 35% 35%, #a8fff0, #3de8c8 55%, #2db89a);
            border-radius: 50%;
            box-shadow: 0 0 22px 7px rgba(61, 232, 200, .45), 0 0 55px 18px rgba(61, 232, 200, .18);
            margin-bottom: 8px;
            position: relative;
            z-index: 2;
            animation: moonGlow 4s ease-in-out infinite;
        }

        @keyframes moonGlow {

            0%,
            100% {
                box-shadow: 0 0 22px 7px rgba(61, 232, 200, .45), 0 0 55px 18px rgba(61, 232, 200, .18);
            }

            50% {
                box-shadow: 0 0 34px 12px rgba(61, 232, 200, .65), 0 0 70px 25px rgba(61, 232, 200, .28);
            }
        }

        .header-title {
            font-family: 'Cinzel', serif;
            color: #fff;
            font-size: 15.5px;
            letter-spacing: 2.5px;
            z-index: 2;
            text-shadow: 0 0 22px rgba(61, 232, 200, .6);
        }

        .header-sub {
            color: rgba(255, 255, 255, .5);
            font-size: 10.5px;
            letter-spacing: 1.2px;
            margin-top: 5px;
            z-index: 2;
        }

        .card-body {
            padding: 22px 28px 26px;
            background: white;
        }

        .login-label {
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 13px;
            letter-spacing: 3px;
            color: var(--teal-mid);
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .input-wrap {
            position: relative;
            margin-bottom: 10px;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            pointer-events: none;
            z-index: 1;
        }

        .input-wrap input {
            width: 100%;
            padding: 11px 16px 11px 42px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--teal-deep), var(--teal-mid));
            color: #fff;
            font-family: 'Raleway', sans-serif;
            font-size: 13px;
            outline: none;
            letter-spacing: .4px;
            transition: box-shadow .3s;
        }

        .input-wrap input::placeholder {
            color: rgba(255, 255, 255, .5);
        }

        .input-wrap input:focus {
            box-shadow: 0 0 0 2px var(--teal-glow), 0 6px 20px rgba(45, 184, 154, .3);
        }

        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 6px 0 16px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #888;
            font-size: 11.5px;
            cursor: pointer;
        }

        .remember input[type=checkbox] {
            accent-color: var(--teal-mid);
            cursor: pointer;
        }

        .forgot {
            color: var(--teal-mid);
            font-size: 11.5px;
            text-decoration: none;
            font-weight: 600;
            transition: color .2s;
        }

        .forgot:hover {
            color: var(--teal-dark);
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 13.5px;
            text-align: center;
            border: 1px solid #ffcdd2;
            display: none;
            /* Hidden by default */
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 17px;
            color: rgba(255, 255, 255, 0.85);
            z-index: 2;
        }

        .password-toggle:hover {
            color: #3de8c8;
            text-shadow: 0 0 8px #3de8c8;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--teal-deep) 0%, var(--teal-mid) 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: 'Cinzel', serif;
            font-size: 13px;
            letter-spacing: 3.5px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform .25s, box-shadow .25s;
        }

        .btn-login::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, .1));
            pointer-events: none;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(13, 74, 69, .45);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .divider {
            text-align: center;
            color: #ccc;
            font-size: 11px;
            margin: 14px 0;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #eee;
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .ai-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-bottom: 12px;
        }

        .ai-dot {
            width: 8px;
            height: 8px;
            background: var(--teal-light);
            border-radius: 50%;
            box-shadow: 0 0 7px var(--teal-light);
            animation: blink 1.8s ease-in-out infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .25;
            }
        }

        .ai-text {
            font-size: 10px;
            letter-spacing: 2.5px;
            color: #aaa;
            text-transform: uppercase;
        }

        .signup-row {
            text-align: center;
            font-size: 12px;
            color: #999;
        }

        .signup-row a {
            color: var(--teal-mid);
            font-weight: 600;
            text-decoration: none;
            transition: color .2s;
        }

        .signup-row a:hover {
            color: var(--teal-dark);
        }
    </style>
</head>

<body>

    <!-- SVG BACKGROUND -->
    <svg id="bg-canvas" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <radialGradient id="skyGrad" cx="50%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#0d5e52" />
                <stop offset="60%" stop-color="#082e2a" />
                <stop offset="100%" stop-color="#040f0e" />
            </radialGradient>
            <linearGradient id="aurora1" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#0d4a45" stop-opacity="0" />
                <stop offset="40%" stop-color="#1a8a70" stop-opacity=".4" />
                <stop offset="70%" stop-color="#3de8c8" stop-opacity=".18" />
                <stop offset="100%" stop-color="#0d4a45" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="aurora2" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#3de8c8" stop-opacity="0" />
                <stop offset="35%" stop-color="#2db89a" stop-opacity=".25" />
                <stop offset="65%" stop-color="#1a7a6e" stop-opacity=".35" />
                <stop offset="100%" stop-color="#3de8c8" stop-opacity="0" />
            </linearGradient>
            <filter id="blur4">
                <feGaussianBlur stdDeviation="4" />
            </filter>
            <filter id="blur8">
                <feGaussianBlur stdDeviation="8" />
            </filter>

        <rect width="1440" height="900" fill="url(#skyGrad)" />

        <ellipse cx="720" cy="220" rx="900" ry="120" fill="url(#aurora1)" filter="url(#blur8)">

                repeatCount="indefinite" />
        </ellipse>
        <ellipse cx="600" cy="310" rx="700" ry="80" fill="url(#aurora2)" filter="url(#blur8)">
            <animateTransform attributeName="transform" type="translate" values="0,0;-30,15;0,0" dur="18s"
                repeatCount="indefinite" />
        </ellipse>

        <circle cx="1100" cy="160" r="90" fill="rgba(61,232,200,.07)" filter="url(#blur8)" />
        <circle cx="1100" cy="160" r="55" fill="rgba(61,232,200,.11)" filter="url(#blur4)" />
        <circle cx="1100" cy="160" r="28" fill="rgba(160,255,240,.18)" />

        <!-- Far mountains -->
        <polygon
            points="0,900 0,520 100,380 200,460 320,290 460,410 600,240 740,380 880,200 1020,350 1160,180 1300,310 1440,220 1440,900"
            fill="#061c19" />
        <!-- Mid mountains -->
        <polygon
            points="0,900 0,620 80,500 200,570 340,420 480,530 620,360 760,490 900,320 1040,460 1180,300 1320,430 1440,350 1440,900"
            fill="#082e2a" />
        <!-- Front ridge -->
        <polygon
            points="0,900 0,720 140,640 300,700 460,620 620,680 780,600 940,660 1100,580 1260,650 1440,590 1440,900"
            fill="#0a3530" />

        <rect x="0" y="800" width="1440" height="100" fill="#071e1b" />

        <!-- Trees LEFT -->
        <rect x="96" y="700" width="8" height="120" fill="#041210" />
        <polygon points="100,540 60,700 140,700" fill="#061c19" />
        <polygon points="100,580 65,710 135,710" fill="#082e2a" />
        <polygon points="100,600 68,715 132,715" fill="#0a3530" />
        <rect x="166" y="710" width="7" height="110" fill="#041210" />
        <polygon points="170,550 128,710 212,710" fill="#082e2a" />
        <polygon points="170,590 133,720 207,720" fill="#0a3530" />
        <rect x="46" y="720" width="6" height="100" fill="#041210" />
        <polygon points="49,580 18,720 80,720" fill="#061c19" />
        <polygon points="49,615 22,728 76,728" fill="#082e2a" />
        <rect x="220" y="730" width="5" height="90" fill="#041210" />
        <polygon points="223,600 200,730 246,730" fill="#082e2a" />

        <!-- Trees RIGHT -->
        <rect x="1306" y="700" width="8" height="120" fill="#041210" />
        <polygon points="1310,540 1268,700 1352,700" fill="#061c19" />
        <polygon points="1310,580 1273,710 1347,710" fill="#082e2a" />
        <polygon points="1310,600 1276,715 1344,715" fill="#0a3530" />
        <rect x="1366" y="710" width="7" height="110" fill="#041210" />
        <polygon points="1370,555 1330,710 1410,710" fill="#082e2a" />
        <polygon points="1370,592 1335,720 1405,720" fill="#0a3530" />
        <rect x="1246" y="720" width="6" height="100" fill="#041210" />
        <polygon points="1249,585 1220,720 1278,720" fill="#061c19" />
        <polygon points="1249,618 1224,728 1274,728" fill="#082e2a" />
        <rect x="1406" y="725" width="5" height="95" fill="#041210" />
        <polygon points="1409,598 1385,725 1433,725" fill="#082e2a" />

        <!-- Lake reflection -->
        <ellipse cx="720" cy="870" rx="500" ry="40" fill="rgba(26,122,110,.18)" filter="url(#blur4)" />
        <ellipse cx="720" cy="875" rx="300" ry="20" fill="rgba(61,232,200,.08)" filter="url(#blur4)" />

        <!-- Shooting stars -->
        <line x1="200" y1="60" x2="230" y2="65" stroke="white" stroke-width="1.5" opacity="0">
            <animate attributeName="x1" values="200;450" dur="2.5s" begin="3s" repeatCount="indefinite" />
            <animate attributeName="y1" values="60;160" dur="2.5s" begin="3s" repeatCount="indefinite" />
            <animate attributeName="x2" values="230;460" dur="2.5s" begin="3s" repeatCount="indefinite" />
            <animate attributeName="y2" values="65;165" dur="2.5s" begin="3s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="3s" repeatCount="indefinite" />
        </line>
        <line x1="1100" y1="40" x2="1112" y2="46" stroke="white" stroke-width="1.5" opacity="0">
            <animate attributeName="x1" values="1100;850" dur="3s" begin="8s" repeatCount="indefinite" />
            <animate attributeName="y1" values="40;140" dur="3s" begin="8s" repeatCount="indefinite" />
            <animate attributeName="x2" values="1112;862" dur="3s" begin="8s" repeatCount="indefinite" />
            <animate attributeName="y2" values="46;146" dur="3s" begin="8s" repeatCount="indefinite" />
            <animate attributeName="opacity" values="0;1;0" dur="3s" begin="8s" repeatCount="indefinite" />
        </line>
    </svg>

    <!-- STARS -->
    <div class="stars" id="stars"></div>

    <!-- GLOW ORBS -->
    <div class="orb"
        style="width:320px;height:320px;background:radial-gradient(circle,rgba(45,184,154,.3),transparent 70%);left:5%;top:10%;--od:14s;--odl:0s;">
    </div>
    <div class="orb"
        style="width:240px;height:240px;background:radial-gradient(circle,rgba(61,232,200,.2),transparent 70%);right:8%;top:20%;--od:17s;--odl:3s;">
    </div>
    <div class="orb"
        style="width:180px;height:180px;background:radial-gradient(circle,rgba(26,122,110,.3),transparent 70%);left:30%;bottom:5%;--od:11s;--odl:6s;">
    </div>

    <!-- SPARKS -->
    <div class="spark" style="left:10%;bottom:15%;--sd:9s;--sdl:0s;--sx:18px;"></div>
    <div class="spark" style="left:20%;bottom:8%;--sd:12s;--sdl:2s;--sx:-22px;"></div>
    <div class="spark" style="left:72%;bottom:12%;--sd:8s;--sdl:4s;--sx:14px;"></div>
    <div class="spark" style="left:82%;bottom:6%;--sd:14s;--sdl:1s;--sx:-18px;"></div>
    <div class="spark" style="left:50%;bottom:10%;--sd:11s;--sdl:3s;--sx:25px;"></div>
    <div class="spark" style="left:38%;bottom:7%;--sd:10s;--sdl:5s;--sx:-12px;"></div>

    <!-- LOGIN CARD -->
    <div class="card">

        <div class="card-header" id="cardHeader">
            <div class="moon"></div>
            <div class="header-title">WELCOME TO THE WEBSITE</div>
            <div class="header-sub">Your AI Chatbot Companion</div>

            <svg class="header-scene" viewBox="0 0 390 90" preserveAspectRatio="none"
                xmlns="http://www.w3.org/2000/svg">
                <polygon points="0,90 0,55 55,22 110,48 170,10 230,38 290,14 345,36 390,22 390,90"
                    fill="rgba(6,28,25,0.55)" />
                <polygon points="0,90 0,68 70,45 150,62 230,32 310,58 390,40 390,90" fill="rgba(8,46,42,0.65)" />
                <polygon points="0,90 50,72 110,82 190,60 270,76 350,62 390,70 390,90" fill="rgba(10,53,48,0.75)" />
                <polygon points="30,82 22,62 38,62" fill="rgba(4,18,16,.8)" />
                <polygon points="50,84 44,70 56,70" fill="rgba(6,28,25,.8)" />
                <polygon points="340,80 333,62 347,62" fill="rgba(4,18,16,.8)" />
                <polygon points="360,83 354,70 366,70" fill="rgba(6,28,25,.8)" />
                <path d="M0,88 Q195,98 390,88 L390,90 L0,90 Z" fill="white" />
            </svg>
        </div>

        <div class="card-body">
            <div class="login-label">User Login</div>
            <!-- {% if error %}
            <div style="background:#ffdddd; color:#d32f2f; padding:12px; border-radius:8px; 
                text-align:center; margin-bottom:20px; font-size:14px; border:1px solid #f5c6cb;">
                {{ error }}
            </div>
            {% endif %} -->
            {% if error %}
            <div id="errorBox" style="
    background:#ffdddd;
    color:#d32f2f;
    padding:12px;
    border-radius:8px;
    text-align:center;
    margin-bottom:20px;
    font-size:14px;
    border:1px solid #f5c6cb;">
                {{ error }}
            </div>
            {% endif %}
            <form method="POST" action="">
                <div class="input-wrap">
                    <span class="input-icon">👤</span>
                    <input type="text" name="username" placeholder="Username" autocomplete="username" required />
                </div>
                <div class="input-wrap">
                    <span class="input-icon">🔒</span>

                    <input type="password" id="passwordInput" name="password" placeholder="Password" required />

                    <span id="togglePassword" class="password-toggle">
                        <i class="fa-solid fa-eye"></i>
                    </span>
                </div>

                <div class="options-row">
                    <label class="remember">
                        <input type="checkbox" name="remember"> Remember me
                    </label>
                    <a href="/forgot-password" class="forgot">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-login">LOGIN</button>
            </form>

            <div class="divider">or</div>

            <div class="ai-badge">
                <div class="ai-dot"></div>
                <span class="ai-text">AI Chatbot Active</span>
                <div class="ai-dot" style="animation-delay:.7s"></div>
            </div>

            <div class="signup-row">
                Don't have an account? <a href="/signup">Sign up</a>
            </div>
        </div>
    </div>

    <script>
        // Background stars
        const starsEl = document.getElementById('stars');
        for (let i = 0; i < 100; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            const size = Math.random() < 0.15 ? 3 : 2;
            s.style.cssText = `
      left:${Math.random() * 100}%;
      top:${Math.random() * 75}%;
      width:${size}px; height:${size}px;
      --d:${2 + Math.random() * 5}s;
      --dl:${Math.random() * 6}s;
      --b:${0.35 + Math.random() * 0.65};
    `;
            starsEl.appendChild(s);
        }

        // Header mini stars
        const hdr = document.getElementById('cardHeader');
        for (let i = 0; i < 28; i++) {
            const s = document.createElement('div');
            s.className = 'hstar';
            const sz = Math.random() < 0.2 ? 3 : 2;
            s.style.cssText = `
      left:${Math.random() * 100}%;
      top:${Math.random() * 80}%;
      width:${sz}px; height:${sz}px;
      opacity:${0.3 + Math.random() * 0.7};
    `;
            hdr.insertBefore(s, hdr.firstChild);
        }

        // Clear error message when user starts typing
        const errorBox = document.getElementById('errorBox');
        const usernameInput = document.getElementById('usernameInput');

        function clearError() {
            if (errorBox.style.display !== "none") {
                errorBox.style.display = "none";
            }
        }

        usernameInput.addEventListener('input', clearError);
        passwordInput.addEventListener('input', clearError);

        // Show error only if it exists from Flask
        window.onload = function () {
            if ("{{ error }}" !== "") {
                errorBox.style.display = "block";
            }
        };
    </script>
    <script>
        const passwordInput = document.getElementById('passwordInput');
        const togglePassword = document.getElementById('togglePassword');
        const icon = togglePassword.querySelector('i');

        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.type === "password";

            // Toggle input type
            passwordInput.type = isPassword ? "text" : "password";

            // Toggle icon
            icon.classList.toggle("fa-eye");
            icon.classList.toggle("fa-eye-slash");
        });
    </script>
    <script>
        window.onload = function () {
            const errorBox = document.getElementById("errorBox");

            if (errorBox) {
                setTimeout(() => {
                    errorBox.style.transition = "opacity 0.5s ease";
                    errorBox.style.opacity = "0";

                    setTimeout(() => {
                        errorBox.style.display = "none";
                    }, 500);
                }, 5000); // ✅ 5 seconds
            }
        };
    </script>
</body>

</html>
